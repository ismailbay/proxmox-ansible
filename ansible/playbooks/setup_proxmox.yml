---
- name: Configure base node settings
  hosts: proxmox
  become: true
  roles:
    - role: hostname
    - role: pve_repos
    - role: powersaving
    - role: nfs_mounts
    - role: common
    # - role: cluster # flacky
    - role: access
      run_once: true
    - role: acme
    - role: notifications
      run_once: true
    - role: metrics
      run_once: true

  handlers:
    - name: Reboot nodes
      ansible.builtin.reboot:
        reboot_timeout: 120

    - name: Restart pveproxy
      ansible.builtin.service:
        name: "pveproxy"
        state: "restarted"

- name: Configure nvme
  hosts: proxmox_nvme
  become: true
  roles:
    - role: nvme
